<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'self' 'unsafe-inline'">
<title>CaptureBox 고정</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1f2430; user-select: none; }
  #img { width: 100%; height: 100%; object-fit: contain; display: block; cursor: move; }
  #x { position: fixed; top: 6px; right: 6px; width: 26px; height: 26px; border: 0; border-radius: 50%; cursor: pointer;
       background: rgba(20,23,31,.78); color: #fff; font: 700 15px/26px 'Segoe UI', sans-serif; padding: 0; opacity: 0; transition: opacity .15s; }
  body:hover #x { opacity: 1; }
  #x:hover { background: #d6403a; }
  #hint { position: fixed; left: 0; right: 0; bottom: 0; padding: 4px 8px; background: rgba(20,23,31,.72); color: #dfe3ee;
          font: 600 11px 'Segoe UI', 'Malgun Gothic', sans-serif; text-align: center; opacity: 0; transition: opacity .15s; }
  body:hover #hint { opacity: 1; }
</style>
</head>
<body>
<img id="img" alt="" draggable="false">
<button id="x" title="닫기 (Esc)">×</button>
<div id="hint">끌어서 이동 · Ctrl+휠 크기 · Alt+휠 투명도 · 더블클릭/Esc 닫기</div>
<script src="pin.js"></script>
</body>
</html>
